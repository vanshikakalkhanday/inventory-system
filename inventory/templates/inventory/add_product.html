<h1>Add Product</h1>
<style>
body{

    font-family: Arial, sans-serif;

}
h1{

    color:#333;

}
form{

    width:350px;

}

input, textarea, select{

    width:100%;

    padding:8px;

    margin:8px 0;

    border:1px solid #ccc;

    border-radius:5px;

}

.btn{

    padding:9px 18px;

    border:none;

    border-radius:6px;

    color:white;

    cursor:pointer;

    text-decoration:none;

    display:inline-block;

    margin-top:10px;

}

.add{

    background:#3498db;

}

.back{

    background:#2ecc71;

}

.error{

    color:red;

    margin-bottom:10px;

}
</style>

{% if messages %}

{% for message in messages %}
<div class="error">

    {{ message }}
</div>

{% endfor %}

{% endif %}

<form method="POST">

{% csrf_token %}

<input type="text" 

name="name" 

placeholder="Product Name"

required>

<textarea 

name="description"

placeholder="Description"

required></textarea>

<input type="number"

name="price"

placeholder="Price"

min="1"

required>

<input type="number"

name="quantity"

placeholder="Quantity"

min="1"

required>

<select name="category">
<option value="">

Select Category
</option>

{% for c in categories %}
<option value="{{ c.id }}">
{{ c.name }}
</option>
{% endfor %}
</select>
<button type="submit" class="btn add">
Add Product
</button>
<a href="{% url 'product_list' %}" class="btn back">
Back
</a>
</form>
